# CF Optimizer for Quantumult X (rewrite_remote)
# 用法:
# 1) 将本文件上传到你可直链访问的位置（GitHub Raw / 自建静态服务器）
# 2) QX -> Rewrite -> 引用 -> 添加 rewrite_remote
# 3) 打开 http://cfui.com 进入 UI
#
# 说明:
# - UI 页面与 /save /sub-save /sub-gen 都由 script-response-body 接管
# - 同时覆盖 http 与 https，避免系统自动升级 https 后规则失效

[rewrite_local]
# Web UI 入口 + 所有子路径
^http://cfui\.com(/.*)?$ url script-response-body https://raw.githubusercontent.com/2473-t/javaScript/main/cf-optimizer-ui.js
^https://cfui\.com(/.*)?$ url script-response-body https://raw.githubusercontent.com/2473-t/javaScript/main/cf-optimizer-ui.js

[task_local]
# CF IP 优选任务（推荐 #auto 从 UI 已保存参数读取）
13 */4 * * * https://raw.githubusercontent.com/2473-t/javaScript/main/cf-ip-optimizer.js#auto, tag=CF优选, enabled=true

# 节点生成任务（推荐 #auto 从 UI 已保存订阅参数读取）
0 9 * * * https://raw.githubusercontent.com/2473-t/javaScript/main/cf-node-gen.js#auto, tag=CF生成节点, enabled=true
